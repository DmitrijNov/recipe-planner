[project]
name = "cookbook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[all]>=0.136.3",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "sqlalchemy>=2.0.50",
]

[tool.fastapi]
entrypoint = "core.main:app"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",  # function calls in defaults — FastAPI Depends()/Query() idiom
]

[tool.ruff.lint.isort]
known-first-party = ["core", "users"]

[tool.ruff.format]
docstring-code-format = true
