name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (example: 1.2.3)"
        required: true
        type: string
      create_image_tag:
        description: Create and push versioned Docker image tag
        required: true
        default: true
        type: boolean
      push_latest:
        description: Also push Docker image as latest
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize version
        id: version
        shell: bash
        run: |
          raw="${{ inputs.version }}"
          if [[ "$raw" =~ ^v ]]; then
            version="${raw#v}"
          else
            version="$raw"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version format: $raw"
            echo "Use 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check tag does not exist
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image tag options
        shell: bash
        run: |
          if [[ "${{ inputs.create_image_tag }}" != "true" && "${{ inputs.push_latest }}" != "true" ]]; then
            echo "At least one image tag target is required"
            echo "Set create_image_tag and/or push_latest to true"
            exit 1
          fi

      - name: Compute Docker tags
        id: docker_tags
        shell: bash
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          version_tag="${{ steps.version.outputs.tag }}"
          tags=""

          if [[ "${{ inputs.create_image_tag }}" == "true" ]]; then
            tags="$image:$version_tag"
          fi

          if [[ "${{ inputs.push_latest }}" == "true" ]]; then
            if [[ -n "$tags" ]]; then
              tags="$tags\n$image:latest"
            else
              tags="$image:latest"
            fi
          fi

          {
            echo "tags<<EOF"
            echo -e "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}

      - name: Create and push git tag
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
