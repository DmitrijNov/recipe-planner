services:
  db:
    image: pgvector/pgvector:pg17
    # Run `docker compose -f docker/docker-compose.yml up -d` from the project
    # root so this .env (shared with the app and Alembic) resolves.
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
